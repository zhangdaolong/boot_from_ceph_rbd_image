# Firmware configuration template

```ini
[ceph]
monitors = 10.20.30.11:3300,10.20.30.12:3300,10.20.30.13:3300
pool = vms
image = guest01-root
client-id = firmware01
# Key material must come from protected firmware/HSM storage, not this file.
key-source = protected-variable
```

The production firmware parser must validate addresses and credential references before network or memory setup. Never compile a plaintext Ceph key into a publicly distributed firmware binary.
