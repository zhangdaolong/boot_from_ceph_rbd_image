# Firmware configuration template
#
# These fields are encoded into the fixed-size CEPH_RBD_CONFIG blob stored in
# the UEFI variable "CephRbdConfig" (GUID
# 9E5F1A2B-3C4D-4E5F-8A9B-0C1D2E3F4A5B). The messenger core implements v1, so
# monitor endpoints must use a v1-enabled port (6789), not the v2-only 3300.

```ini
[ceph]
fsid = 4f6b7f7d-3c39-4d74-ae2c-9ad7f9b2d7a1
monitors = 10.20.30.11:6789,10.20.30.12:6789,10.20.30.13:6789
pool = 1
image = guest01-root
client-id = firmware01
# Key material must come from protected firmware/HSM storage, not this file.
key-source = protected-variable
# 0x2 makes the DXE entry point map the image without a controller binding.
flags = 0
```

The production firmware parser must validate addresses and credential references before network or memory setup. Never compile a plaintext Ceph key into a publicly distributed firmware binary.
